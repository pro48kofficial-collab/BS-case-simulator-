<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Neon Case Game</title>

<style>
body{
margin:0;
font-family:Arial;
color:white;
background:#05060a;
}

/* BACKGROUND */
body::before{
content:"";
position:fixed;
inset:0;
background:url("https://images.unsplash.com/photo-1601758123927-1962c2b6d9a3?auto=format&fit=crop&w=1400&q=80");
background-size:cover;
opacity:0.2;
z-index:-1;
}

/* LOADING */
#loading{
position:fixed;
inset:0;
background:#000;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
z-index:9999;
}
.loader{
width:60px;height:60px;
border:4px solid #222;
border-top:4px solid cyan;
border-radius:50%;
animation:spin 1s linear infinite;
margin-bottom:10px;
}
@keyframes spin{to{transform:rotate(360deg)}}
.fadeOut{
opacity:0;
visibility:hidden;
transition:0.5s;
}

/* TOP */
.top{
position:fixed;
top:10px;
left:10px;
display:flex;
gap:8px;
align-items:center;
z-index:5;
}

#avatarImg{
width:45px;
height:45px;
border-radius:50%;
object-fit:cover;
border:2px solid cyan;
background:#222;
}

#nick{
width:90px;
padding:5px;
background:#111;
border:1px solid cyan;
color:white;
}

/* STATS */
.stats{
position:fixed;
top:10px;
right:10px;
background:#111;
padding:8px;
border:1px solid cyan;
border-radius:8px;
}

.level{
position:fixed;
top:70px;
right:10px;
color:cyan;
}

/* MENU */
.menu{
position:fixed;
bottom:0;
width:100%;
display:flex;
background:#111;
border-top:1px solid cyan;
}
.menu button{
flex:1;
padding:12px;
background:none;
border:none;
color:white;
}

/* MAIN */
.center{
padding-top:90px;
padding-bottom:70px;
display:flex;
flex-direction:column;
align-items:center;
gap:10px;
}

/* CASE */
.caseBox{
border:1px solid cyan;
padding:10px;
margin:5px;
width:90%;
text-align:center;
}

/* ROULETTE */
.roulette{
width:320px;
overflow:hidden;
border:2px solid cyan;
position:relative;
margin-top:10px;
}
.items{
display:flex;
transition:transform 4s cubic-bezier(0.1,0.7,0.1,1);
}
.item{
min-width:80px;
height:80px;
display:flex;
align-items:center;
justify-content:center;
font-size:12px;
}
.common{background:#555}
.rare{background:#3b82f6}
.epic{background:#a855f7}
.legendary{background:#f59e0b}

.pointer{
position:absolute;
left:50%;
top:0;
transform:translateX(-50%);
width:3px;
height:100%;
background:red;
}

/* INVENTORY / MARKET */
.invItem{
background:#111;
margin:5px;
padding:8px;
border:1px solid cyan;
display:flex;
justify-content:space-between;
}
</style>
</head>

<body>

<!-- LOADING -->
<div id="loading">
<div class="loader"></div>
Загрузка...
</div>

<!-- PROFILE -->
<div class="top">
<img id="avatarImg">
<div>
<input id="nick" placeholder="Nick"><br>
<input type="file" id="avatar">
</div>
</div>

<!-- STATS -->
<div class="stats">
💰 <span id="coins">0</span><br>
⭐ Lv <span id="lvl">1</span>
</div>

<div class="level" id="exp">EXP: 0/100</div>

<!-- MAIN -->
<div class="center" id="main"></div>

<!-- MENU -->
<div class="menu">
<button onclick="shop()">Shop</button>
<button onclick="inventoryUI()">Inv</button>
<button onclick="clicker()">💰</button>
<button onclick="marketUI()">Market</button>
</div>

<script>

/* ELEMENTS */
let coinsEl, lvlEl, expEl, mainEl, avatarInput, avatarImgEl, nickInput;

/* DATA */
let coins = +localStorage.getItem("coins") || 100;
let xp = +localStorage.getItem("xp") || 0;
let lvl = +localStorage.getItem("lvl") || 1;

let inv = JSON.parse(localStorage.getItem("inv")) || [];
let market = JSON.parse(localStorage.getItem("market")) || [];

/* ITEMS */
const items=[
{name:"AK-47",rarity:"common"},
{name:"M4",rarity:"rare"},
{name:"AWP",rarity:"epic"},
{name:"Knife",rarity:"legendary"}
];

/* SAVE */
function save(){
localStorage.setItem("coins",coins);
localStorage.setItem("xp",xp);
localStorage.setItem("lvl",lvl);
localStorage.setItem("inv",JSON.stringify(inv));
localStorage.setItem("market",JSON.stringify(market));
localStorage.setItem("nick",nickInput.value);
localStorage.setItem("avatar",avatarImgEl.src);
}

/* UPDATE */
function update(){
coinsEl.innerText = coins;
lvlEl.innerText = lvl;
expEl.innerText = `EXP: ${xp}/100`;
save();
}

/* XP */
function addXP(){
xp += 10;
if(xp >= 100){
lvl++;
xp = 0;
}
}

/* CLICKER */
function clicker(){
coins++;
addXP();
update();
}

/* SHOP */
function shop(){
mainEl.innerHTML="";
[50,100,200].forEach(price=>{
let d=document.createElement("div");
d.className="caseBox";
d.innerHTML=`Case ${price}💰 <button onclick="openCase(${price})">Open</button>`;
mainEl.appendChild(d);
});
}

/* GENERATE */
function gen(){
let c=document.getElementById("items");
c.innerHTML="";
for(let i=0;i<50;i++){
let it=items[Math.floor(Math.random()*items.length)];
let d=document.createElement("div");
d.className="item "+it.rarity;
d.innerText=it.name;
c.appendChild(d);
}
}

/* OPEN CASE */
function openCase(price){
if(coins < price) return;

coins -= price;

mainEl.innerHTML=`
<div class="roulette">
<div class="pointer"></div>
<div id="items" class="items"></div>
</div>
<button onclick="shop()">⬅ Назад</button>
<div id="res"></div>
`;

gen();

let c=document.getElementById("items");
let win=40;
let offset=(win*80)-150;

c.style.transition="none";
c.style.transform="translateX(0px)";

setTimeout(()=>{
c.style.transition="transform 4s cubic-bezier(0.1,0.7,0.1,1)";
c.style.transform=`translateX(-${offset}px)`;
},50);

setTimeout(()=>{
let item=c.children[win].innerText;

inv.push({name:item,price:Math.floor(Math.random()*100)+20});
coins += 20;

addXP();
update();

document.getElementById("res").innerText="🎉 "+item;
},4000);
}

/* INVENTORY */
function inventoryUI(){
mainEl.innerHTML="";
inv.forEach((i,idx)=>{
let d=document.createElement("div");
d.className="invItem";
d.innerHTML=`${i.name} 💰${i.price} 
<button onclick="sell(${idx})">Sell</button>`;
mainEl.appendChild(d);
});
}

/* SELL */
function sell(i){
coins += inv[i].price;
inv.splice(i,1);
update();
inventoryUI();
}

/* MARKET */
function marketUI(){
mainEl.innerHTML="<h3>💱 Market</h3>";

market.forEach((m,idx)=>{
let d=document.createElement("div");
d.className="invItem";
d.innerHTML=`${m.name} 💰${m.price}
<button onclick="buy(${idx})">Buy</button>`;
mainEl.appendChild(d);
});

mainEl.innerHTML += "<hr><h4>Your Inventory</h4>";

inv.forEach((i,idx)=>{
let d=document.createElement("div");
d.className="invItem";
d.innerHTML=`${i.name} 💰${i.price}
<button onclick="list(${idx})">List</button>`;
mainEl.appendChild(d);
});
}

/* LIST */
function list(i){
market.push(inv[i]);
inv.splice(i,1);
save();
marketUI();
}

/* BUY */
function buy(i){
if(coins < market[i].price) return;

coins -= market[i].price;
inv.push(market[i]);
market.splice(i,1);

update();
marketUI();
}

/* INIT */
window.onload = ()=>{
coinsEl = document.getElementById("coins");
lvlEl = document.getElementById("lvl");
expEl = document.getElementById("exp");
mainEl = document.getElementById("main");
avatarInput = document.getElementById("avatar");
avatarImgEl = document.getElementById("avatarImg");
nickInput = document.getElementById("nick");

/* LOAD PROFILE */
nickInput.value = localStorage.getItem("nick") || "";
avatarImgEl.src = localStorage.getItem("avatar") || "";

/* AVATAR */
avatarInput.onchange = e=>{
let r=new FileReader();
r.onload=()=>{
avatarImgEl.src=r.result;
save();
}
r.readAsDataURL(e.target.files[0]);
};

nickInput.oninput = save;

/* START */
setTimeout(()=>{
document.getElementById("loading").classList.add("fadeOut");
shop();
update();
},1500);
};

</script>

</body>
  </html>
