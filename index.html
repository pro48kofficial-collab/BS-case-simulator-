<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Neon Case Game</title>

<style>
body{
margin:0;
font-family:Arial;
color:white;
background:#05060a;
}

/* background */
body::before{
content:"";
position:fixed;
inset:0;
background:url("https://images.unsplash.com/photo-1601758123927-1962c2b6d9a3?auto=format&fit=crop&w=1400&q=80");
background-size:cover;
opacity:0.2;
z-index:-1;
}

/* TOP */
.top{
position:fixed;
top:10px;
left:10px;
display:flex;
gap:8px;
align-items:center;
}

#avatarImg{
width:45px;height:45px;
border-radius:50%;
border:2px solid cyan;
object-fit:cover;
}

#nick{
width:90px;
background:#111;
color:white;
border:1px solid cyan;
}

/* STATS */
.stats{
position:fixed;
top:10px;
right:10px;
background:#111;
padding:8px;
border:1px solid cyan;
border-radius:8px;
}

/* MENU */
.menu{
position:fixed;
bottom:0;
width:100%;
display:flex;
background:#111;
border-top:1px solid cyan;
}

.menu button{
flex:1;
padding:10px;
background:none;
border:none;
color:white;
}

/* MAIN */
.center{
padding-top:80px;
padding-bottom:70px;
display:flex;
flex-direction:column;
align-items:center;
}

/* BUTTONS */
.btn{
padding:10px;
margin:5px;
border:1px solid cyan;
background:#111;
color:white;
border-radius:6px;
}

/* CASE */
.caseBox{
border:1px solid cyan;
padding:10px;
margin:5px;
width:90%;
text-align:center;
}

/* ROULETTE */
.roulette{
width:320px;
overflow:hidden;
border:2px solid cyan;
position:relative;
margin-top:10px;
}
.items{
display:flex;
transition:transform 4s cubic-bezier(0.1,0.7,0.1,1);
}
.item{
min-width:80px;
height:80px;
display:flex;
justify-content:center;
align-items:center;
font-size:12px;
}

.common{background:#555}
.rare{background:#3b82f6}
.epic{background:#a855f7}
.legendary{background:#f59e0b}

.pointer{
position:absolute;
left:50%;
top:0;
transform:translateX(-50%);
width:3px;
height:100%;
background:red;
}

/* INVENTORY */
.invItem{
background:#111;
margin:5px;
padding:8px;
border:1px solid cyan;
display:flex;
justify-content:space-between;
}

/* CLICKER */
.clickBtn{
font-size:40px;
background:none;
border:none;
color:gold;
text-shadow:0 0 10px gold;
}

/* LEVEL */
.level{
position:fixed;
top:60px;
right:10px;
color:cyan;
}
</style>
</head>

<body>

<div class="top">
<img id="avatarImg">
<input id="nick" placeholder="Nick">
<input type="file" id="avatar">
</div>

<div class="stats">
💰 <span id="coins">0</span><br>
⭐ Lv <span id="lvl">1</span>
</div>

<div class="level" id="exp">EXP: 0/100</div>

<div class="center" id="main"></div>

<div class="menu">
<button onclick="shop()">Shop</button>
<button onclick="inventoryUI()">Inv</button>
<button onclick="clicker()">💰</button>
<button onclick="market()">Market</button>
</div>

<script>
/* SAVE DATA */
let coins=+localStorage.getItem("coins")||100;
let xp=+localStorage.getItem("xp")||0;
let lvl=+localStorage.getItem("lvl")||1;
let inv=JSON.parse(localStorage.getItem("inv"))||[];

/* SOUND */
const sound=new Audio("https://actions.google.com/sounds/v1/cartoon/clang_and_wobble.ogg");

/* ITEMS */
const items=[
{name:"AK-47",rarity:"common"},
{name:"M4",rarity:"rare"},
{name:"AWP",rarity:"epic"},
{name:"Knife",rarity:"legendary"}
];

/* UPDATE */
function update(){
coinsEl.innerText=coins;
lvlEl.innerText=lvl;
exp.innerText=`EXP: ${xp}/100`;

localStorage.setItem("coins",coins);
localStorage.setItem("xp",xp);
localStorage.setItem("lvl",lvl);
localStorage.setItem("inv",JSON.stringify(inv));
}

/* LEVEL SYSTEM */
function addXP(){
xp+=10;
if(xp>=100){
lvl++;
xp=0;
}
}

/* CLICKER */
function clicker(){
coins++;
addXP();
update();
}

/* SHOP */
function shop(){
main.innerHTML="";
[50,100,200].forEach((price,i)=>{
let d=document.createElement("div");
d.className="caseBox";
d.innerHTML=`Case ${i+1} - ${price}💰 <button onclick="openCase(${price})">Open</button>`;
main.appendChild(d);
});
}

/* CASE OPEN */
function openCase(price){
if(coins<price)return;

coins-=price;
sound.play();

main.innerHTML=`
<div class="roulette">
<div class="pointer"></div>
<div id="strip" class="items"></div>
</div>
<div id="res"></div>
`;

let strip=document.getElementById("strip");
strip.innerHTML="";

for(let i=0;i<50;i++){
let it=items[Math.floor(Math.random()*items.length)];
let d=document.createElement("div");
d.className="item "+it.rarity;
d.innerText=it.name;
strip.appendChild(d);
}

let win=40;
let offset=(win*80)-150;

setTimeout(()=>{
strip.style.transform=`translateX(-${offset}px)`;
},50);

setTimeout(()=>{
let item=strip.children[win].innerText;
inv.push(item);

coins+=20;
addXP();

document.getElementById("res").innerText="🎉 "+item;
update();
},4000);
}

/* INVENTORY */
function inventoryUI(){
main.innerHTML="";
inv.forEach((i,idx)=>{
let d=document.createElement("div");
d.className="invItem";
d.innerHTML=i+" <button onclick='sell("+idx+")'>Sell</button>";
main.appendChild(d);
});
}

/* SELL */
function sell(i){
coins+=30;
inv.splice(i,1);
update();
inventoryUI();
}

/* MARKET */
function market(){
main.innerHTML=`
<div class="caseBox">Sell items for coins</div>
`;
}

/* LOAD AVATAR */
avatar.onchange=e=>{
let r=new FileReader();
r.onload=()=>{
avatarImg.src=r.result;
localStorage.setItem("avatar",r.result);
}
r.readAsDataURL(e.target.files[0]);
};

nick.oninput=()=>localStorage.setItem("nick",nick.value);

/* INIT */
function init(){
coinsEl.innerText=coins;
lvlEl.innerText=lvl;
shop();
}
init();

/* SAVE LOOP */
setInterval(update,1000);
</script>

</body>
  </html>
