<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Case Simulator</title>

<style>
body{
margin:0;
font-family:Arial;
color:white;

/* 🎯 CS:GO-like background */
background:url("https://images.unsplash.com/photo-1601758123927-1962c2b6d9a3?auto=format&fit=crop&w=1400&q=80");
background-size:cover;
background-position:center;
}

/* dark overlay */
body::before{
content:"";
position:fixed;
width:100%;
height:100%;
background:rgba(0,0,0,0.75);
top:0;left:0;
z-index:-1;
}

/* LOADING */
#loading{
position:fixed;width:100%;height:100%;
background:#000;
display:flex;flex-direction:column;
justify-content:center;align-items:center;
z-index:10;
}
.loader{
width:50px;height:50px;
border:5px solid #333;
border-top:5px solid cyan;
border-radius:50%;
animation:spin 1s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}

/* TOP */
.top{
position:fixed;top:5px;left:5px;
display:flex;gap:8px;align-items:center;
z-index:5;
}

#avatarImg{
width:45px;height:45px;
border-radius:50%;
object-fit:cover;
background:#222;
}

#nick{
width:90px;
padding:3px;
border-radius:6px;
border:none;
}

/* BALANCE */
.balance{
position:fixed;
top:5px;
right:10px;
background:#111827;
padding:6px 10px;
border-radius:8px;
}

/* MENU */
.menu{
position:fixed;
bottom:0;
width:100%;
display:flex;
background:#111827;
}
.menu button{
flex:1;
padding:12px;
background:none;
border:none;
color:white;
}

/* CENTER */
.center{
padding-top:80px;
padding-bottom:60px;
display:flex;
flex-direction:column;
align-items:center;
}

/* CASE */
.case{
background:#111827;
padding:10px;
margin:5px;
width:90%;
border-radius:10px;
text-align:center;
}

/* OPENING */
.opening{
width:95%;
max-width:400px;
overflow:hidden;
border:2px solid cyan;
position:relative;
margin-top:10px;
}

.items{
display:flex;
transition:transform 4s cubic-bezier(0.1,0.7,0.1,1);
}

.item{
min-width:80px;
height:80px;
display:flex;
align-items:center;
justify-content:center;
font-size:12px;
}

.common{background:#555}
.rare{background:#3b82f6}
.epic{background:#a855f7}
.legendary{background:#f59e0b}

/* POINTER */
.pointer{
position:absolute;
left:50%;
top:0;
transform:translateX(-50%);
width:3px;
height:100%;
background:red;
}

/* INVENTORY */
.invItem{
background:#111827;
margin:5px;
padding:8px;
border-radius:6px;
display:flex;
justify-content:space-between;
}

/* CLICKER */
.clickBtn{
margin-top:20px;
padding:15px 25px;
background:#1f2937;
border:none;
border-radius:10px;
color:white;
}
</style>
</head>

<body>

<!-- LOADING -->
<div id="loading">
<div class="loader"></div>
Загрузка...
</div>

<!-- TOP -->
<div class="top">
<img id="avatarImg">
<div>
<input id="nick" placeholder="Нік"><br>
<input type="color" id="nickColor">
<input type="file" id="avatar">
</div>
</div>

<!-- BALANCE -->
<div class="balance" id="balance">💰 0</div>

<!-- MAIN -->
<div class="center" id="main"></div>

<!-- MENU -->
<div class="menu">
<button onclick="showCases()">Кейси</button>
<button onclick="showInventory()">Інвентар</button>
<button onclick="showClicker()">Клікер</button>
</div>

<script>
let balance=+localStorage.getItem("bal")||100;

let inventory=JSON.parse(localStorage.getItem("inv"))||[];

/* LOAD SAVE */
nick.value=localStorage.getItem("nick")||"";
nickColor.value=localStorage.getItem("color")||"#ffffff";
avatarImg.src=localStorage.getItem("avatar")||"";

function saveAll(){
localStorage.setItem("bal",balance);
localStorage.setItem("inv",JSON.stringify(inventory));
localStorage.setItem("nick",nick.value);
localStorage.setItem("color",nickColor.value);
localStorage.setItem("avatar",avatarImg.src);
}

/* AVATAR */
avatar.onchange=e=>{
let reader=new FileReader();
reader.onload=()=>{
avatarImg.src=reader.result;
saveAll();
}
reader.readAsDataURL(e.target.files[0]);
};

nick.oninput=saveAll;
nickColor.oninput=()=>{
nick.style.color=nickColor.value;
saveAll();
};

/* BALANCE */
function updateBal(){
balanceEl.innerText="💰 "+balance;
saveAll();
}

/* CASES */
const items=[
{name:"AK-47",class:"common"},
{name:"M4",class:"rare"},
{name:"AWP",class:"epic"},
{name:"Knife",class:"legendary"}
];

function showCases(){
main.innerHTML=`
<div class="case" onclick="openCase()">📦 Відкрити кейс</div>

<div class="opening">
<div class="pointer"></div>
<div id="items" class="items"></div>
</div>

<div id="result"></div>
`;
generate();
}

function generate(){
let c=document.getElementById("items");
c.innerHTML="";
for(let i=0;i<50;i++){
let it=items[Math.floor(Math.random()*items.length)];
let d=document.createElement("div");
d.className="item "+it.class;
d.innerText=it.name;
c.appendChild(d);
}
}

function openCase(){
generate();

let c=document.getElementById("items");
let win=40;
let offset=(win*80)-150;

c.style.transition="none";
c.style.transform="translateX(0px)";

setTimeout(()=>{
c.style.transition="transform 4s cubic-bezier(0.1,0.7,0.1,1)";
c.style.transform=`translateX(-${offset}px)`;
},50);

setTimeout(()=>{
let item=c.children[win].innerText;

inventory.push({name:item});
balance-=10;

document.getElementById("result").innerText="🎉 "+item;

saveAll();
updateBal();
},4000);
}

/* INVENTORY */
function showInventory(){
main.innerHTML="<b>Інвентар</b>";
inventory.forEach((i,idx)=>{
let d=document.createElement("div");
d.className="invItem";
d.innerHTML=i.name+" <button onclick='sell("+idx+")'>💰</button>";
main.appendChild(d);
});
}

function sell(i){
inventory.splice(i,1);
balance+=20;
saveAll();
updateBal();
showInventory();
}

/* CLICKER */
function showClicker(){
main.innerHTML=`
<button class="clickBtn" onclick="clicker()">КЛІК 💰</button>
`;
}

function clicker(){
balance+=5;
updateBal();
}

/* START */
setTimeout(()=>{
document.getElementById("loading").style.display="none";
updateBal();
showCases();
},2000);
</script>

</body>
  </html>
