<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Neon Case Simulator</title>

<style>
body{
margin:0;
font-family:Arial;
color:#fff;

/* neon cs-like background */
background:#05060a;
}

/* glow overlay */
body::before{
content:"";
position:fixed;
inset:0;
background:radial-gradient(circle at top, rgba(0,255,255,0.15), transparent 50%);
pointer-events:none;
}

/* LOADING */
#loading{
position:fixed;inset:0;
background:#000;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
z-index:10;
}
.loader{
width:50px;height:50px;
border:4px solid #222;
border-top:4px solid cyan;
border-radius:50%;
animation:spin 1s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}

/* TOP PROFILE */
.top{
position:fixed;
top:10px;
left:10px;
display:flex;
gap:10px;
align-items:center;
z-index:5;
}

#avatarImg{
width:45px;
height:45px;
border-radius:50%;
object-fit:cover;
border:2px solid cyan;
box-shadow:0 0 10px cyan;
}

#nick{
width:90px;
padding:5px;
border-radius:6px;
border:1px solid cyan;
background:#0b0f1a;
color:white;
box-shadow:0 0 10px cyan;
}

/* BALANCE */
.balance{
position:fixed;
top:10px;
right:10px;
padding:6px 10px;
border:1px solid cyan;
border-radius:8px;
box-shadow:0 0 10px cyan;
}

/* MAIN */
.center{
padding-top:90px;
padding-bottom:80px;
display:flex;
flex-direction:column;
align-items:center;
}

/* CASE BOX */
.case{
padding:12px;
margin:8px;
width:90%;
text-align:center;
border:1px solid cyan;
border-radius:10px;
box-shadow:0 0 10px cyan;
}

/* OPENING */
.opening{
width:95%;
max-width:420px;
overflow:hidden;
border:2px solid cyan;
position:relative;
margin-top:15px;
box-shadow:0 0 15px cyan;
}

.items{
display:flex;
transition:transform 4s cubic-bezier(0.1,0.7,0.1,1);
}

.item{
min-width:80px;
height:80px;
display:flex;
align-items:center;
justify-content:center;
font-size:12px;
}

.common{background:#555}
.rare{background:#3b82f6}
.epic{background:#a855f7}
.legendary{background:#f59e0b}

.pointer{
position:absolute;
left:50%;
top:0;
transform:translateX(-50%);
width:3px;
height:100%;
background:cyan;
box-shadow:0 0 10px cyan;
}

/* INVENTORY */
.invItem{
background:#0b0f1a;
margin:5px;
padding:8px;
border:1px solid cyan;
border-radius:6px;
display:flex;
justify-content:space-between;
box-shadow:0 0 8px cyan;
}

/* CLICKER */
.clickBtn{
margin-top:25px;
font-size:40px;
background:none;
border:none;
color:gold;
text-shadow:0 0 10px gold;
}

/* BOTTOM MENU */
.menu{
position:fixed;
bottom:0;
left:0;
width:100%;
display:flex;
background:#05060a;
border-top:1px solid cyan;
box-shadow:0 0 15px cyan;
}

.menu button{
flex:1;
padding:12px;
background:none;
border:none;
color:white;
font-size:14px;
}
</style>
</head>

<body>

<!-- LOADING -->
<div id="loading">
<div class="loader"></div>
</div>

<!-- PROFILE -->
<div class="top">
<img id="avatarImg">
<div>
<input id="nick" placeholder="Nick"><br>
<input type="file" id="avatar">
</div>
</div>

<!-- BALANCE -->
<div class="balance" id="balance">💰 0</div>

<!-- MAIN -->
<div class="center" id="main"></div>

<!-- MENU -->
<div class="menu">
<button onclick="showCases()">Кейси</button>
<button onclick="showInventory()">Інвентар</button>
<button onclick="showClicker()">💰</button>
</div>

<script>
let balance=+localStorage.getItem("bal")||100;
let inventory=JSON.parse(localStorage.getItem("inv"))||[];

/* SAVE */
function save(){
localStorage.setItem("bal",balance);
localStorage.setItem("inv",JSON.stringify(inventory));
localStorage.setItem("nick",nick.value);
localStorage.setItem("avatar",avatarImg.src);
}

/* LOAD */
nick.value=localStorage.getItem("nick")||"";
avatarImg.src=localStorage.getItem("avatar")||"";

/* BALANCE FIX */
function update(){
document.getElementById("balance").innerText="💰 "+balance;
save();
}
update();

/* AVATAR */
avatar.onchange=e=>{
let r=new FileReader();
r.onload=()=>{
avatarImg.src=r.result;
save();
}
r.readAsDataURL(e.target.files[0]);
};

/* CASE */
const items=[
{name:"AK-47",class:"common"},
{name:"M4",class:"rare"},
{name:"AWP",class:"epic"},
{name:"Knife",class:"legendary"}
];

function showCases(){
main.innerHTML=`
<div class="case" onclick="openCase()">📦 Відкрити кейс</div>

<div class="opening">
<div class="pointer"></div>
<div id="items" class="items"></div>
</div>

<div id="result"></div>
`;
generate();
}

/* GENERATE */
function generate(){
let c=document.getElementById("items");
c.innerHTML="";
for(let i=0;i<50;i++){
let it=items[Math.floor(Math.random()*items.length)];
let d=document.createElement("div");
d.className="item "+it.class;
d.innerText=it.name;
c.appendChild(d);
}
}

/* OPEN CASE FIXED */
function openCase(){
generate();
let c=document.getElementById("items");

let win=40;
let offset=(win*80)-160;

c.style.transition="none";
c.style.transform="translateX(0px)";

setTimeout(()=>{
c.style.transition="transform 4s cubic-bezier(0.1,0.7,0.1,1)";
c.style.transform=`translateX(-${offset}px)`;
},50);

setTimeout(()=>{
let item=c.children[win].innerText;

/* FIX: ALWAYS ADD GOLD */
inventory.push({name:item});
balance += 10;

document.getElementById("result").innerText="🎉 "+item;

update();
},4000);
}

/* INVENTORY */
function showInventory(){
main.innerHTML="<b>Інвентар</b>";
inventory.forEach((i,idx)=>{
let d=document.createElement("div");
d.className="invItem";
d.innerHTML=i.name+" <button onclick='sell("+idx+")'>💰</button>";
main.appendChild(d);
});
}

function sell(i){
inventory.splice(i,1);
balance+=20;
update();
showInventory();
}

/* CLICKER */
function showClicker(){
main.innerHTML=`
<button class="clickBtn" onclick="click()">💰</button>
`;
}

function click(){
balance+=5;
update();
}

/* START */
setTimeout(()=>{
loading.style.display="none";
showCases();
},2000);
</script>

</body>
  </html>
