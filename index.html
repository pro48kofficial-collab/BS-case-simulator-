<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Case Game FIXED</title>

<style>
body{
margin:0;
font-family:Arial;
background:#05060a;
color:white;
}

/* LOADING */
#loading{
position:fixed;inset:0;
background:#000;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
z-index:9999;
}
.loader{
width:50px;height:50px;
border:4px solid #222;
border-top:4px solid cyan;
border-radius:50%;
animation:spin 1s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}
.fade{opacity:0;visibility:hidden;transition:.5s}

/* TOP */
.top{
position:fixed;
top:10px;
left:10px;
display:flex;
gap:10px;
align-items:center;
z-index:10;
}

#avatarImg{
width:45px;
height:45px;
border-radius:50%;
background:#222;
border:2px solid cyan;
object-fit:cover;
}

#nick{
width:90px;
background:#111;
border:1px solid cyan;
color:white;
padding:5px;
}

/* STATS */
.stats{
position:fixed;
top:10px;
right:10px;
background:#111;
padding:8px;
border:1px solid cyan;
}

/* MAIN */
.center{
padding-top:90px;
padding-bottom:80px;
display:flex;
flex-direction:column;
align-items:center;
gap:10px;
}

/* BUTTON FIX (no overlap) */
.menu{
position:fixed;
bottom:0;
width:100%;
display:flex;
background:#111;
border-top:1px solid cyan;
}

.menu button{
flex:1;
padding:12px;
border:none;
background:none;
color:white;
font-size:14px;
}

/* CASE */
.caseBox{
padding:12px;
border:1px solid cyan;
width:90%;
text-align:center;
border-radius:8px;
}

/* INVENTORY */
.invItem{
margin:5px;
padding:8px;
border:1px solid cyan;
display:flex;
justify-content:space-between;
}

/* CLICKER */
.clickBtn{
font-size:40px;
background:none;
border:none;
color:gold;
text-shadow:0 0 10px gold;
cursor:pointer;
}
</style>
</head>

<body>

<!-- LOADING -->
<div id="loading">
<div class="loader"></div>
Loading...
</div>

<!-- PROFILE -->
<div class="top">
<img id="avatarImg">
<div>
<input id="nick" placeholder="Nick"><br>
<input type="file" id="avatar">
</div>
</div>

<!-- STATS -->
<div class="stats">
💰 <span id="coins">100</span>
</div>

<!-- MAIN -->
<div class="center" id="main"></div>

<!-- MENU -->
<div class="menu">
<button onclick="shop()">Cases</button>
<button onclick="invUI()">Inventory</button>
<button onclick="clicker()">💰</button>
</div>

<script>

/* DATA */
let coins = 100;
let inv = [];

/* ELEMENTS */
let main;

/* UPDATE UI */
function update(){
document.getElementById("coins").innerText = coins;
}

/* CLICKER FIXED */
function clicker(){
coins++;
update();
}

/* SHOP */
function shop(){
main.innerHTML = `
<div class="caseBox" onclick="openCase()">📦 Open Case (10💰)</div>
`;
}

/* CASE FIXED */
function openCase(){
if(coins < 10) return;

coins -= 10;

let items = ["AK-47","M4","AWP","Knife"];
let win = items[Math.floor(Math.random()*items.length)];

inv.push(win);

update();

alert("Випало: " + win);
}

/* INVENTORY */
function invUI(){
main.innerHTML = "";
inv.forEach(i=>{
let d=document.createElement("div");
d.className="invItem";
d.innerText=i;
main.appendChild(d);
});
}

/* AVATAR FIX */
avatar.onchange = (e)=>{
let r = new FileReader();
r.onload = ()=>{
avatarImg.src = r.result;
}
r.readAsDataURL(e.target.files[0]);
};

/* INIT SAFE */
window.onload = ()=>{
main = document.getElementById("main");

setTimeout(()=>{
loading.classList.add("fade");
shop();
update();
},1200);
};

</script>

</body>
</html>
