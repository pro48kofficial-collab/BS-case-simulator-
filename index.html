<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Case Game Ultimate</title>

<style>
body{margin:0;font-family:Arial;background:#0b0f14;color:white}

/* LOADING */
#loading{
position:fixed;inset:0;
background:#000;
display:flex;
align-items:center;
justify-content:center;
z-index:999;
}
.fade{opacity:0;visibility:hidden;transition:.5s}

/* MENU LEFT */
.menu{
position:fixed;
left:0;top:0;
width:90px;height:100%;
background:#111;
display:flex;
flex-direction:column;
border-right:1px solid #222;
}
.menu button{
padding:15px;
background:none;border:none;color:#aaa;
}

/* TOP */
.top{
position:fixed;
top:10px;left:100px;
display:flex;gap:10px;
}
#avatarImg{
width:45px;height:45px;border-radius:50%;
border:2px solid cyan;
background:#222;
}

/* MAIN */
.center{
margin-left:100px;
padding:20px;
}

/* BOX */
.card{
background:#111;
padding:10px;
margin:10px;
border-radius:10px;
}

/* ROULETTE */
.roulette{
width:320px;overflow:hidden;
margin:auto;border:2px solid #333;
position:relative;
}
.items{display:flex;transition:4s}
.item{min-width:80px;height:80px;display:flex;align-items:center;justify-content:center}
.common{background:#555}
.rare{background:#3b82f6}
.epic{background:#a855f7}
.legendary{background:#f59e0b}
.pointer{
position:absolute;left:50%;
width:3px;height:100%;
background:red;
}

/* INV */
.inv{
display:flex;
justify-content:space-between;
margin:5px;
padding:5px;
border:1px solid cyan;
}
</style>
</head>

<body>

<div id="loading">Loading...</div>

<div class="menu">
<button onclick="menu()">🏠</button>
<button onclick="cases()">📦</button>
<button onclick="inventoryUI()">🎒</button>
<button onclick="marketUI()">💱</button>
<button onclick="battle()">🔫</button>
</div>

<div class="top">
<img id="avatarImg">
<div>
<input id="nick" placeholder="Nick"><br>
<input type="file" id="avatar">
</div>
</div>

<div class="center" id="main"></div>

<script>

/* DATA */
let coins=+localStorage.getItem("coins")||100;
let inv=JSON.parse(localStorage.getItem("inv"))||[];
let market=JSON.parse(localStorage.getItem("market"))||[];

/* ITEMS */
const items=[
{name:"AK",rarity:"common"},
{name:"M4",rarity:"rare"},
{name:"AWP",rarity:"epic"},
{name:"KNIFE",rarity:"legendary"}
];

const price={common:20,rare:50,epic:120,legendary:300};

/* SAVE */
function save(){
localStorage.setItem("coins",coins);
localStorage.setItem("inv",JSON.stringify(inv));
localStorage.setItem("market",JSON.stringify(market));
localStorage.setItem("nick",nick.value);
localStorage.setItem("avatar",avatarImg.src);
}

/* MENU */
function menu(){
main.innerHTML=`
<h1>CASE GAME</h1>
<button onclick="cases()">📦 Кейси</button>
<button onclick="battle()">🔫 Бій</button>
`;
}

/* CASE */
function cases(){
main.innerHTML=`
<div class="card">
<button onclick="openCase()">Відкрити кейс (50💰)</button>
</div>`;
}

/* OPEN */
function openCase(){
if(coins<50)return;
coins-=50;

main.innerHTML=`
<div class="roulette">
<div class="pointer"></div>
<div id="roll" class="items"></div>
</div>
<div id="res"></div>
`;

let roll=document.getElementById("roll");

for(let i=0;i<60;i++){
let it=items[Math.floor(Math.random()*items.length)];
let d=document.createElement("div");
d.className="item "+it.rarity;
d.innerText=it.name;
roll.appendChild(d);
}

let win=45;
let offset=(win*80)-150;

setTimeout(()=>{roll.style.transform=`translateX(-${offset}px)`},50);

setTimeout(()=>{
let name=roll.children[win].innerText;
let r=items.find(i=>i.name==name);

inv.push({name:name,rarity:r.rarity,price:price[r.rarity]});
coins+=10;
save();

document.getElementById("res").innerHTML=`<h2>${name}</h2>`;
},4000);
}

/* INVENTORY */
function inventoryUI(){
main.innerHTML="";
inv.forEach((i,idx)=>{
main.innerHTML+=`
<div class="inv">
${i.name} (${i.rarity}) 💰${i.price}
<button onclick="sell(${idx})">Sell</button>
<button onclick="list(${idx})">List</button>
</div>`;
});
}

/* SELL */
function sell(i){
coins+=inv[i].price;
inv.splice(i,1);
save();
inventoryUI();
}

/* MARKET */
function marketUI(){
main.innerHTML="<h3>Market</h3>";
market.forEach((m,idx)=>{
main.innerHTML+=`
<div class="inv">
${m.name} 💰${m.price}
<button onclick="buy(${idx})">Buy</button>
</div>`;
});
}

/* LIST */
function list(i){
market.push(inv[i]);
inv.splice(i,1);
save();
inventoryUI();
}

/* BUY */
function buy(i){
if(coins<market[i].price)return;
coins-=market[i].price;
inv.push(market[i]);
market.splice(i,1);
save();
marketUI();
}

/* BATTLE */
function battle(){
let p=0,e=0,log="";
for(let i=0;i<10;i++){
if(Math.random()>0.5){p++;log+="Kill<br>"}else{e++;log+="Death<br>"}
}
coins+=p*10;

main.innerHTML=`
<h2>Бій</h2>
<p>${p} : ${e}</p>
${log}
`;
save();
}

/* AVATAR */
avatar.onchange=e=>{
let r=new FileReader();
r.onload=()=>{avatarImg.src=r.result;save();}
r.readAsDataURL(e.target.files[0]);
};

/* INIT */
window.onload=()=>{
nick.value=localStorage.getItem("nick")||"";
avatarImg.src=localStorage.getItem("avatar")||"";

setTimeout(()=>{
loading.classList.add("fade");
menu();
},1200);
};

</script>

</body>
  </html>
